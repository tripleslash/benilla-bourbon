[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["sam <samuv.eth@gmail.com>"]

# Shared pins live here; promote a dep the moment two crates pin the same version (the policy
# since day one, enacted at the 0530 debt sweep). Per-crate feature additions stay in the crate.
# `image` deliberately stays per-crate: its default-features/feature sets differ per consumer,
# and a workspace default-features choice can't be subtracted from downstream.
[workspace.dependencies]
anyhow = "1.0.102"
# bevy's `default` is `["2d", "3d", "ui"]`, and every one of those three pulls `audio`
# (= `bevy_audio` + `vorbis`) — so a default bevy compiles rodio, a second cpal, a second ALSA
# binding and an ogg/vorbis decoder into a client that mixes through kira and has had bevy's
# `AudioPlugin` disabled at boot since 0530. This spells the same `default` out with `audio`
# taken away: `2d`/`3d`/`ui` decomposed into the parts they are made of, which is the whole
# union of the three minus that one entry (decision 1932 has the expansion, verified against a
# before/after feature tree). Nothing else in the graph asks for it — avian3d, bevy_egui and
# bevy_transform_interpolation all take bevy with `default-features = false`.
#
# If a future bevy needs another member, add it here by name; do not reach back for `2d`/`3d`/
# `ui`, which would quietly bring the audio stack with it.
bevy = { version = "0.18.1", default-features = false, features = [
    "default_app",
    "default_platform",
    "2d_bevy_render",
    "3d_bevy_render",
    "ui_api",
    "ui_bevy_render",
    "scene",
    "picking",
] }
# The render app's raw GPU handles (the WOW_GPU_MS meter's query set): bevy 0.18 does not wrap
# wgpu's QuerySet family, so the meter reaches for the same wgpu the workspace already builds.
wgpu = "27"
clap = { version = "4.6.1", features = ["derive"] }
sha1 = "0.10.6"

# The WoW format + protocol stack is fully in-repo (decision 0021), so there are no warcraft-rs /
# wow_messages crates (or forks of them) anywhere in the tree. That is still true and is why this
# section stood empty for the project's whole life.
#
# The one entry below is not a fork of a WoW crate at all. `lua-src` compiles the Lua the client's
# addon VM runs on, and the 1.12 corpus needs one opcode that Lua 5.1 deleted — the iterator-less
# generic-for (`for k, v in someTable do`), which 183 of 218 corpus addons are reached by and which
# is the first session-start error for 60 of them. It is an OPCODE, so no layer above the VM can
# reach it: not a library function, not a global, not a metamethod.
#
# The fork is currently BYTE-IDENTICAL to upstream's 5.1.5 sources, and is landed that way on
# purpose: the pipeline is proven transparent before the behavioural payload goes into it, so that
# when the suite moves, the patch is the only thing that could have moved it. The payload waits on
# an RE answer about what the real client's own Lua does — stock Lua 5.0 is corroboration, not the
# authority. `third_party/lua-src/BENILLA.md` has the current state and the verifying command.
[patch.crates-io]
lua-src = { path = "third_party/lua-src" }
# The browser build keeps `lua_Integer = i64` on wasm32 — one-line fork, see third_party/mlua-sys/BENILLA.md.
mlua-sys = { path = "third_party/mlua-sys" }
# kira 0.12.1 with one patch: spatial gains and the volume tween evaluated per CHUNK and
# interpolated, not per frame (decision 1945; `third_party/kira/BENILLA.md`).
kira = { path = "third_party/kira" }
# bevy_tasks 0.18.1, forked so the browser build can have threads at all. Upstream gates its
# `multi_threaded` alias on `target_arch` rather than `target_feature`, which makes "wasm" and "has
# no threads" the same statement — they stopped being the same statement when the browser got shared
# memory. The fork also supplies the threads themselves (`std::thread::spawn` is the `unsupported`
# stub on wasm32 even with atomics) and keeps the main thread out of `Atomics.wait`, which traps
# there rather than erroring. One patch entry covers the graph: every bevy crate depends on this one.
# `third_party/bevy_tasks/BENILLA.md` has the hunk list and the verifying diff.
bevy_tasks = { path = "third_party/bevy_tasks" }
# bevy_ecs 0.18.1, forked for the same reason and in the same shape: 13 threading gates in
# `query/par_iter.rs` and `query/state.rs` that ask `target_arch == "wasm32"` when they mean
# "has no threads". Left alone: `ExecutorKind`'s wasm default, which stays SingleThreaded on
# purpose — decisions 1366/1437 measured the multi-threaded executor as a LOSS on this app
# (~60% of Update systems are non-Send), and `benilla_app::run` sets the kinds explicitly
# anyway. `third_party/bevy_ecs/BENILLA.md` has the list and the verifying diff.
bevy_ecs = { path = "third_party/bevy_ecs" }
# async-executor 1.14.0, forked for ONE `use` line. It guards its state with `std::sync::Mutex` and
# `RwLock`, which on wasm32+atomics are futex-based — and the browser main thread may not execute
# `memory.atomic.wait32`: it throws rather than waiting. This executor is shared between that thread
# and the Web Worker pool, so the locks are contended across the boundary on every frame that runs a
# `par_iter_mut`. The fork swaps them for spin equivalents on that target alone.
# `third_party/async-executor/BENILLA.md` has the argument and the verifying diff.
async-executor = { path = "third_party/async-executor" }
# bevy_render 0.18.1, forked for TWO `ComputeTaskPool::scope` call sites. `WgpuWrapper` is a
# `SendWrapper` under wasm+atomics and panics if dereferenced off its creating thread; upstream
# guards `renderer/mod.rs` for exactly that and misses `batching::gpu_preprocessing`, which hands
# `&RenderDevice`/`&RenderQueue` into `scope.spawn`. The fork reroutes those two through a serial
# scope on that target alone. `third_party/bevy_render/BENILLA.md` has the diff.
bevy_render = { path = "third_party/bevy_render" }
# event-listener 5.4.1, forked for ONE `use` line, and the least obvious of the four. `Event` is
# what `async-channel` parks on, so its mutex is taken on every send/recv that registers or notifies
# a listener -- and in the threaded browser build the main thread and a worker per core are on
# opposite ends of those channels. With `std` on, the crate takes `intrusive.rs` and a real
# `std::sync::Mutex` on EVERY target including wasm (its own spinning mutex in `slab.rs` is the
# no_std path only), so a contended send on the page thread threw `Atomics.wait cannot be called in
# this context`. `third_party/event-listener/BENILLA.md` has the diff.
event-listener = { path = "third_party/event-listener" }
# parking 2.2.1, forked for ONE function. `futures_lite::block_on` parks worker threads on it, and
# `Unparker::unpark` -- which the main thread calls whenever spawning work wakes a sleeping worker --
# takes a `std::sync::Mutex` to close a race with the parker. That lock is the last blocking call an
# unparking thread makes, and on the page thread it threw. `try_lock` in a spin instead, same
# semantics; `park` is untouched because a worker may block.
# `third_party/parking/BENILLA.md` has the diff.
parking = { path = "third_party/parking" }

# Optimize *dependencies* even in dev builds. avian/parry collision math (and wgpu/bevy render) is
# unusably slow at opt-level 0 — a plain `cargo run` crawls to <1 fps once physics is doing real work.
# opt-level 3 on deps (the standard Bevy fix) makes debug builds playable while our own crates stay
# lightly optimized for fast incremental rebuilds. One-time cost: deps recompile optimized the first time.
[profile.dev.package."*"]
opt-level = 3

# Our own crates at opt-level 1, not 0: Bevy's generic hot paths (material specialization scans,
# query par_for_each closures) monomorphize INTO our crate, so at opt 0 they run at debug codegen
# speed over every resident entity — measured at Stormwind as the difference between ~45 fps and a
# pinned 60 (decision 0362). Warm incremental rebuild cost measured at ~zero. NB: FPS probe numbers
# in decisions ≤ 0361 were taken at opt 0 and are not comparable with post-0362 probes.
[profile.dev]
opt-level = 1

# No debuginfo trimming: `debug = "line-tables-only"` was A/B-measured (decision 0192) at zero
# recurring win on this stack (macOS unpacked split-debuginfo; sccache; fast ld) — not worth
# invalidating every warm target and the sccache cache for.

# Shipping-grade optimization, A/B-graded at the pin (decision 0736): −1.0 cpu_ms (−5 %) vs
# default release, flat at the empty-map and bare-Bevy floors. The campaign keeps grading on
# default `release` — same-day A/B is the law, and fat LTO's link time would tax every
# iteration for a constant offset. Build with `--profile ship` for actual releases (add
# `RUSTFLAGS=-Ctarget-cpu=native` for a machine-local binary; not set here — it isn't portable).
[profile.ship]
inherits = "release"
lto = "fat"
codegen-units = 1

# The director's play loop (decision 1157): `release` plus incremental compilation. `benilla-app` is one crate of
# ~243k lines, and release is non-incremental by cargo's default, so a one-line edit re-optimizes
# all of it — measured 2m47s (43s frontend, ~121s LLVM at opt-level 3) against a 1.8s stamp rebuild
# and a 2.5s no-op. Incremental caches both halves per codegen unit, so an edit pays for what it
# touched. Cargo applies `incremental` to workspace members ONLY (verified: `target/debug/incremental`
# holds our 16 crates and zero registry deps), so the ~760 dependencies stay non-incremental and
# sccache-cacheable — 0192's wrapper and the cold-slot build are untouched.
#
# Why a separate profile rather than flipping `release`: incremental raises the codegen-unit count
# and drops cross-unit inlining, which is a real codegen difference. The FPS campaign grades on
# default `release` (0736) and same-day A/B is the law, so the graded profile must not quietly
# change under it. Run it as `cargo play` (the alias in `.cargo/config.toml`).
[profile.play]
inherits = "release"
incremental = true
# ThinLTO OFF, and it is not a performance choice -- it is the fix for rustc #86049. `release`
# implies thin-LOCAL LTO (ThinLTO across a crate's own codegen units), which promotes each CGU's
# internal anonymous constants to external symbols named `anon.<hash>.N.llvm.<moduleid>`. Under
# `incremental` some CGUs come back from the cache carrying names minted in an earlier compile,
# so a promoted reference finds no definition and `cc` fails with "symbol(s) not found for
# architecture arm64" -- an intermittent link failure with no source-level cause, cleared only by
# a full rebuild. Measured on the 2026-08-29 occurrence: 7 poisoned CGUs in `benilla-formats`, 48
# unresolved symbols. `lto = "off"` disables the promotion step entirely (verified: the play rlib
# goes from 381 undefined `anon.*.llvm.*` symbols to 0). `release` and `ship` are UNTOUCHED -- they
# are non-incremental, cannot hit this, and stay the graded profiles (0736). Decision 1698.
lto = "off"
