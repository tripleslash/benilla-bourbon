[package]
name = "benilla-assets"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bevy AssetSource + AssetLoaders over the WoW 1.12.1 MPQ patch chain"

[lints]
workspace = true

[features]
# The dev/player seam, on by default. `benilla-formats` comes in without default features and its
# `dev` is forwarded here, or unification would put it back in a player build.
default = ["dev"]
dev = ["benilla-formats/dev"]

[dependencies]
# Wall-clock reads (`SystemTime::now`) go through `web-time`: a re-export of std's on native, and
# `Date.now()` in a browser, where std's panics on first use (`anim_rng`'s session seed).
web-time = "1"
anyhow.workspace = true
bevy.workspace = true
benilla-formats = { path = "../benilla-formats", default-features = false }
# Nearest-neighbour resize of layer BLPs smaller than `LAYER_TEX_SIZE`: texel replication in gamma
# bytes, with no averaging to darken mid-tones.
image = { version = "0.25", default-features = false }
serde = { version = "1", features = ["derive"] }

# No wasm-specific dependencies. `MpqAssetReader::read` used to hand-roll a `fetch` here; it now
# awaits `Chain::read_async`, so every browser API this crate touched moved behind
# `benilla_formats::webpack` where the pack store already needed them.
