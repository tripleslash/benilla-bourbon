[package]
name = "benilla-pfui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Opt-in pfUI compatibility primitives and a headless dependency audit"

[lints]
workspace = true

[features]
default = []
# Nampower's spell queue, CVars, Lua API and events on top of the ClassicAPI layer.
nampower = ["benilla-ui/nampower"]
audit = ["dep:benilla-formats", "dep:roxmltree", "dep:serde"]

[dependencies]
benilla-ui = { path = "../benilla-ui", features = ["pfui"] }
# The script host's Lua, under the name the host uses (`benilla_ui::mlua`).
mlua = { path = "../benilla-mlua", package = "benilla-mlua" }
base64 = "0.22"
ciborium = "0.2"
miniz_oxide = "0.8"
serde_json = "1"
# Wall-clock reads (`combat_log`): std's on native, `Date.now()` on wasm32.
web-time = "1"
benilla-formats = { path = "../benilla-formats", default-features = false, optional = true }
benilla-dbc = { path = "../benilla-dbc" }
roxmltree = { version = "0.20", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[[bin]]
name = "pfui-audit"
path = "src/bin/audit.rs"
required-features = ["audit"]
