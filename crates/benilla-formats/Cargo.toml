[package]
name = "benilla-formats"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WoW 1.12.1 asset-format adapters (MPQ/BLP/DBC/ADT/WDT) and the benilla-extract CLI"

[lints]
workspace = true

[features]
# `dev` gates one thing, the project folder (`install::project_folder`), whose fallback bakes this
# source tree's path into the binary. Every dependent takes this crate without default features and
# forwards `dev`, or unification puts the path back into a player build.
default = ["dev"]
dev = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
benilla-adt = { path = "../benilla-adt" }
benilla-bytes = { path = "../benilla-bytes" }
benilla-dbc = { path = "../benilla-dbc" }
benilla-m2 = { path = "../benilla-m2" }
benilla-mpq = { path = "../benilla-mpq" }
benilla-blp = { path = "../benilla-blp" }
# PNG only: the default `avif` feature would pull in rav1e, a whole AV1 encoder, to write PNGs.
image = { version = "0.25", default-features = false, features = ["png"] }
benilla-wdt = { path = "../benilla-wdt" }
benilla-wmo = { path = "../benilla-wmo" }

[dev-dependencies]
glam = "0.31"

# `Chain` reads a BENPACK container over HTTP instead of mounting MPQ archives on the web target
# (no filesystem there) — see `src/webpack/`. Pinned exact per the wasm plan's global constraint: a
# newer wasm-bindgen crate than the installed 0.2.126 CLI emits glue the CLI can't match.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.126"
# `AssetReader`'s lane awaits its pack fetches (webpack::resident) rather than blocking the tab.
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3.99", features = [
    "Window",
    "Location",
    "Response",
    "XmlHttpRequest",
    "XmlHttpRequestResponseType",
    # One call site: `web::console_warn`, for the optional-layer open that has to tell a player
    # their HD container is not hosted. `tracing` is off on the web build
    # (`quiet_console_on_web`), so the console is the only place left to say it.
    "console",
] }
# The container's reader. Default features only — the `write` half is the native packer's, and
# keeping it off is what lets this dependency exist at all on wasm32.
benilla-pack = { path = "../benilla-pack" }
# The page seams are plain globals (`__wenilla_packs`, `__wenilla_boottrace`), reached through
# Reflect rather than a wasm-bindgen module import, so the client still runs on a page that ships
# neither.
js-sys = "0.3"
