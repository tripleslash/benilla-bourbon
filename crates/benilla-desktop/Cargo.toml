[package]
name = "benilla-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "fork: desktop — the self-contained Windows client: benilla's launcher with its game data fetched from wow.example.com and every file it keeps in wow-data/ beside the executable"

[lints]
workspace = true

[features]
# Off in the shipped build (`scripts/build-desktop.sh` builds `--no-default-features`); on, it is
# a dev build that still reads the origin and keeps its state beside the executable.
default = ["dev"]
dev = ["benilla-app/dev"]

[dependencies]
# fork: pfUI, its Turtle TOCs and Nampower are always in the client (the `pfui`, `pfui-turtle` and
# `nampower` extensions), as in the web page; `build-desktop.sh`'s `--no-default-features` keeps them.
benilla-app = { path = "../benilla-app", default-features = false, features = [
    "pfui-turtle",
    "nampower",
] }
# The self-update (`src/update.rs`): the same blocking HTTPS client and rustls roots the pack store
# fetches with, and the SHA-1 the downloaded exe is checked against.
sha1.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls"] }

# The update's progress window (`src/update/window.rs`), plain Win32 and GDI.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
benilla-buildstamp = { path = "../benilla-buildstamp" }
# The executable's icon resource (web/favicon.ico, WoW.exe's own), compiled with the Windows SDK's
# rc.exe when the target is Windows.
winresource = "0.1"

# The self-update, a library so its tests build without the client.
[lib]
path = "src/lib.rs"

[[bin]]
name = "wow-reforged"
path = "src/main.rs"
test = false
