[package]
name = "wenilla"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The browser entry point: a wasm-bindgen `#[start]` that boots benilla-app inside the canvas `web/index.html` gives it — benilla's third launcher shim, after `benilla` and `benilla-worldview` (decision 1160), and like them just carries the build-id stamp so a commit dirties this ~20-line crate instead of the app"

[lints]
workspace = true

[features]
# Which browser GPU API the page renders through. `web/index.html`'s Trunk link picks, via
# `data-cargo-features`: WebGL2 (every browser, no secure context needed — but no storage buffers,
# so the glue screens only) or WebGPU (Chrome/Edge/Safari; Chrome on Linux behind
# chrome://flags/#enable-unsafe-webgpu; needs https or localhost). Exactly one must be on, and the
# hosted page is `webgpu` — the world needs storage buffers.
webgl2 = ["benilla-app/webgl2"]
webgpu = ["benilla-app/webgpu"]
# fork: perf — the per-system CPU profile (`benilla-world`'s `system_profile`), always on where built
# in; off in the hosted page, on for a profiling build through `web/index.html`'s feature list.
trace_systems = ["benilla-app/trace_systems"]

[lib]
crate-type = ["cdylib"]

[dependencies]
# `default-features = false`, same load-bearing reason as the `benilla` shim's own dependency on
# this crate: without it, `cargo build --target wasm32-unknown-unknown -p wenilla
# --no-default-features` would still pull benilla-app's OWN defaults (a path dep gets its own
# feature resolution), silently linking the dev instruments into the page everyone visits.
benilla-app = { path = "../benilla-app", default-features = false }
# Pinned exact (workspace-wide rule, `docs/BENILLA-WASM-SPIKE.md`'s plan): a newer wasm-bindgen
# crate plus the 0.2.126 CLI Trunk downloads emits broken glue — verified.
wasm-bindgen = "=0.2.126"
# Routes a Rust panic to `console.error` instead of the default "unreachable executed" the browser
# shows with no message at all — the only way a wasm crash is diagnosable from just the page.
console_error_panic_hook = "0.1"
# One call: `Reflect::has(global(), "document")`, which is how `start()` tells the page apart from a
# pool thread instantiating the same module. Already in the graph via benilla-app.
js-sys = "0.3"

[build-dependencies]
benilla-buildstamp = { path = "../benilla-buildstamp" }
