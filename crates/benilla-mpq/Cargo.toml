[package]
name = "benilla-mpq"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Read-only MPQ archive reader for WoW 1.12.1 (build 5875)"

[lints]
workspace = true

[dependencies]
# Bounds-checked byte readers and the allocation cap on the header, block table and sectors.
benilla-bytes = { path = "../benilla-bytes" }
# One-shot inflate for the ZLIB (0x02) sector codec, pure Rust: 1.5x miniz_oxide's over the
# install's sectors. Called directly, not as flate2's backend, which would switch every flate2 user
# in the binary and so the wire's deflate, which zlib-rs emits differently from zlib. The page's
# BENPACK frames never come through here: this is the native install's and the packer's read.
zlib-rs = { version = "0.6", default-features = false, features = ["std"] }

[dev-dependencies]
# The tests' zlib sectors.
flate2 = "1.1"
